services:
  postgres:
    image: postgres:16-alpine
    container_name: hexald-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: hexald
      POSTGRES_PASSWORD: hexald
      POSTGRES_DB: hexald
    volumes:
      - hexald_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hexald -d hexald"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: hexald-api
    ports:
      - "9088:9088"
    env_file:
      - apps/api/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 9088
      DATABASE_URL: postgresql://hexald:hexald@postgres:5432/hexald
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:9089,http://localhost:9089}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NUXT_API_PROXY_TARGET: http://api:9088
        # Interpolated from `--env-file apps/web/.env` (deploy) or shell / root `.env`
        NUXT_PUBLIC_FIREBASE_API_KEY: ${NUXT_PUBLIC_FIREBASE_API_KEY:-}
        NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        NUXT_PUBLIC_FIREBASE_PROJECT_ID: ${NUXT_PUBLIC_FIREBASE_PROJECT_ID:-}
        NUXT_PUBLIC_FIREBASE_APP_ID: ${NUXT_PUBLIC_FIREBASE_APP_ID:-}
        NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-https://hexald.com}
        NUXT_PUBLIC_ADSENSE_CLIENT_ID: ${NUXT_PUBLIC_ADSENSE_CLIENT_ID:-}
    container_name: hexald-web
    ports:
      - "9089:9089"
    env_file:
      - apps/web/.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 9089
    depends_on:
      - api

volumes:
  hexald_pg:
