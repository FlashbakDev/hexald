services:
  postgres:
    image: postgres:16-alpine
    container_name: hexald-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: hexald
      POSTGRES_PASSWORD: hexald
      POSTGRES_DB: hexald
    volumes:
      - hexald_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hexald -d hexald"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hexald_pg:
