name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          # Nuxt client build alone can take ~6–7m on the VPS; default is 10m.
          command_timeout: 30m
          script: |
            set -e
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            git fetch origin main
            git reset --hard origin/main
            # apps/web/.env is gitignored and stays on the VPS — pass it for build-args
            # (landing `/` is prerendered with Firebase public config) + container runtime.
            docker compose --env-file apps/web/.env -f docker-compose.yml -f docker-compose.prod.yml up -d --build --remove-orphans
            # Best-effort cleanup: daemon may already be pruning; never fail the deploy for this.
            sleep 5
            docker image prune -f || { sleep 10; docker image prune -f; } || true
